services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/interview_bank
      # 生产环境务必通过 .env 文件或环境变量覆盖 JWT_SECRET 和管理员密码
      JWT_SECRET: ${JWT_SECRET:-please-change-me-to-a-long-random-string}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-admin}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-admin123456}
    depends_on:
      - mongo

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo-data:
