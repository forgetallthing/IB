services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ibadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-please-change-me}
    ports:
      # 宿主机自定义端口:容器内 27017，方便本地机器远程直连
      - '${MONGO_PORT:-28117}:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_USER:-ibadmin}:${MONGO_PASSWORD:-please-change-me}@mongo:27017/interview_bank?authSource=admin
      # 生产环境务必通过 .env 文件或环境变量覆盖 JWT_SECRET 和管理员密码
      JWT_SECRET: ${JWT_SECRET:-please-change-me-to-a-long-random-string}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-admin}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-admin123456}
      # 微信小程序登录：未配置时微信登录接口返回 501，账号密码登录不受影响
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
    depends_on:
      - mongo

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # nginx 配置和 SSL 证书用挂载方式，更新配置无需重新构建镜像
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  mongo-data:
