services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./backend
    env_file:
      - .env.example
    depends_on:
      - mongo
    ports:
      - "3000:3000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mongo_data:
